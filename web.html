
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drug Tariff Analytics - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f6fa;
      color: #1f2937;
    }
    h1 { color: #174ea6; }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin: 20px 0;
    }
    label {
      display: block;
      margin: 14px 0 6px;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
    }
    button {
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Drug Tariff Analytics</h1>
  <p>Administrator panel for uploading tariff data.</p>

  <section>
    <h2>Upload tariff file</h2>
    <form action="/admin/upload" method="post"
          enctype="multipart/form-data">
      <label for="token">Admin action token</label>
      <input id="token" name="token" type="password" required>

      <label for="kind">File type</label>
      <select id="kind" name="kind">
        <option value="drug_tariff">Drug tariff</option>
        <option value="concessions">Concessions</option>
      </select>

      <label for="month">Month</label>
      <input id="month" name="month" type="month" required>

      <label for="file">Tariff file</label>
      <input id="file" name="file" type="file"
             accept=".csv,.xlsx" required>

      <button type="submit">Upload and process</button>
    </form>
  </section>

  <p><a href="/">Return to public dashboard</a></p>
</body>
</html>
